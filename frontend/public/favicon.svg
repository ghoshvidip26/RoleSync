<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rs-sync-grad" x1="4" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#635BFF" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="rs-spark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="44" height="44" rx="12" fill="#0B1020" stroke="#25304A" stroke-width="1.5" />

  <!-- S-Sync Flow Lines -->
  <g>
    <!-- Upper S-Loop Arc -->
    <path d="M 14 19 C 14 13.5, 18.5 10.5, 24 10.5 C 27 10.5, 29.5 11.5, 31 13" stroke="url(#rs-sync-grad)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Diagonal S Cross Bridge -->
    <path d="M 28 15 C 27 18, 17 22, 16 28" stroke="url(#rs-sync-grad)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Lower S-Loop Arc -->
    <path d="M 13 30 C 14.5 32, 17.5 33.5, 21 33.5 C 26.5 33.5, 30.5 30, 30.5 24.5" stroke="url(#rs-sync-grad)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Directional arrowheads -->
    <path d="M 28.5 10 L 32 13.5 L 28.5 17" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 15.5 27 L 12 30.5 L 15.5 34" stroke="#635BFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- AI 4-Point Sparkle at Top-Right -->
  <path d="M 32 4.5 Q 32 8.5 36 8.5 Q 32 8.5 32 12.5 Q 32 8.5 28 8.5 Q 32 8.5 32 4.5 Z" fill="url(#rs-spark-grad)" />
  <circle cx="32" cy="8.5" r="0.8" fill="#FFFFFF" />
</svg>
